buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://repo.dairy.foundation/releases' }
    }
    dependencies {
        classpath 'dev.frozenmilk:Load:0.3.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Pedro AutoTune (com.pedropathing:tuning) 1.0.1 has a startup bug: its TunerScanner
// allocates a new NarrowSearch for every class Sinister scans. On a Control Hub that
// scan runs past the 20 s service timeout, the Robot Controller is killed with an ANR
// in FtcRobotControllerWatchdogService, and the hub LED stays solid blue.
// Leave this false until a fixed AutoTune release is published.
def enablePedroAutoTune = true

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    if (!enablePedroAutoTune) {
        sourceSets.main.java.exclude 'org/firstinspires/ftc/teamcode/pedro/Tuning.java'
        sourceSets.main.java.exclude 'org/firstinspires/ftc/teamcode/pedro/procedures/**'
    }
}

repositories {
    maven { url = 'https://repo.dairy.foundation/releases' }
    maven { url = 'https://maven.brott.dev/' }
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.StateFactory-Dev' }
    }
}

// Slothboard provides the original FTC Dashboard classes.
configurations.configureEach {
    exclude group: 'com.acmerobotics.dashboard'
}

dependencies {
    implementation project(':FtcRobotController')

    // Keep Load, Sloth, Slothboard, and Sloth Panels on the same Sloth version.
    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'
    implementation 'com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0'
    //implementation 'com.bylazar.sloth:fullpanels:0.3.2+1.0.13'

    // Pedro 3
    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:telemetry:1.0.0'
    if (enablePedroAutoTune) {
        implementation 'com.pedropathing:tuning:1.0.1'
    }

    // State factory + marrow
    implementation 'com.github.StateFactory-Dev:StateFactory:0.3.9'
    implementation 'com.skeletonarmyftc.marrow:core:1.1.2'

}
